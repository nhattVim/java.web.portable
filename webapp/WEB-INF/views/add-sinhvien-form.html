<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title></title>
        <style>
            body {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 60vh;
            }

            form {
                border: 1px solid black;
                padding: 20px;
                border-radius: 5px;
            }

            input[type="text"],
            input[type="email"],
            input[type="date"],
            select {
                padding: 4px;
                margin-bottom: 10px;
                border: 1px solid #ccc;
                border-radius: 5px;
            }

            input[type="submit"] {
                padding: 10px 20px;
                background-color: #008effff;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }

            input[type="button"] {
                padding: 10px 20px;
                background-color: #00d700;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }

            label {
                display: inline-block;
                width: 130px;
            }

            .buttons {
                display: flex;
                justify-content: right;
                margin-top: 20px;
                gap: 10px;
            }
        </style>
    </head>

    <body>
        <h2>Thêm sinh viên</h2>
        <form
            th:action="@{/sinhvien/add}"
            th:object="${totNghiep}"
            method="post"
        >
            <!-- SinhVien -->
            <label>CMND:</label>
            <input type="text" th:field="*{sinhVien.soCMND}" required />
            <br />
            <label>Họ tên:</label>
            <input type="text" th:field="*{sinhVien.hoTen}" />
            <br />
            <label>Email:</label>
            <input type="email" th:field="*{sinhVien.email}" />
            <br />
            <label>Số điện thoại:</label>
            <input type="text" th:field="*{sinhVien.soDT}" />
            <br />
            <label>Địa chỉ:</label>
            <input type="text" th:field="*{sinhVien.diaChi}" />
            <br />

            <!-- TotNghiep EmbeddedId (hidden) -->
            <input type="hidden" th:field="*{id.soCMND}" />

            <!-- Truong -->
            <label>Trường:</label>
            <select th:field="*{id.maTruong}" required>
                <option
                    th:each="t : ${danhSachTruong}"
                    th:value="${t.maTruong}"
                    th:text="${t.tenTruong}"
                ></option>
            </select>
            <br />

            <!-- Nganh -->
            <label>Ngành:</label>
            <select th:field="*{id.maNganh}" required>
                <option
                    th:each="n : ${danhSachNganh}"
                    th:value="${n.maNganh}"
                    th:text="${n.tenNganh}"
                ></option>
            </select>
            <br />

            <!-- TotNghiep fields -->
            <label>Hệ TN:</label>
            <input type="text" th:field="*{heTN}" />
            <br />
            <label>Ngày TN:</label>
            <input type="date" th:field="*{ngayTN}" required />
            <br />
            <label>Loại TN:</label>
            <input type="text" th:field="*{loaiTN}" />
            <br />

            <div class="buttons">
                <input type="submit" value="Submit" />
                <input
                    type="button"
                    th:onclick="|window.location.href='@{/}'|"
                    value="Quay lại"
                />
            </div>
        </form>
    </body>
</html>
