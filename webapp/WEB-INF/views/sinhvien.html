<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title></title>
        <style>
            table {
                border-collapse: collapse;
            }

            th,
            td {
                border: 1px solid black;
                padding: 10px;
            }

            body {
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: column;
                height: 60vh;
            }

            .top-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 40px;
            }

            button {
                margin-left: 20px;
            }
        </style>
    </head>

    <body>
        <h1>Danh sách sinh viên</h1>

        <div class="top-bar">
            <form th:action="@{/sinhvien/search}" method="get">
                <label for="search">Search:</label>
                <input id="search" name="search" />
                <button type="submit" class="btn">search</button>
            </form>
            <button
                type="button"
                th:onclick="|window.location.href='@{/sinhvien/add}'|"
            >
                Thêm sinh viên
            </button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Số CMND</th>
                    <th>Họ tên</th>
                    <th>Email</th>
                    <th>Số điện thoại</th>
                    <th>Địa chi</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="s : ${danhSachSinhVien}">
                    <td th:text="${s.soCMND}"></td>
                    <td th:text="${s.hoTen}"></td>
                    <td th:text="${s.email}"></td>
                    <td th:text="${s.soDT}"></td>
                    <td th:text="${s.diaChi}"></td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
