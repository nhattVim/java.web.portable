<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Thống kê tốt nghiệp</title>
        <style>
            body {
                display: flex;
                justify-content: center;
                flex-direction: column;
                align-items: center;
                height: 100vh;
            }

            table {
                border-collapse: collapse;
            }

            th,
            td {
                border: 1px solid black;
                padding: 10px;
            }

            .top-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 40px;
            }

            button {
                padding: 4px;
                margin-left: 20px;
            }
        </style>
    </head>

    <body>
        <h1>Thống kê tốt nghiệp</h1>

        <div class="top-bar">
            <form th:action="@{/totnghiep/search}" method="get">
                <label for="search">Search:</label>
                <input id="search" name="search" />
                <button type="submit" class="btn">search</button>
            </form>
            <button type="button" th:onclick="|window.location.href='@{/}'|">
                Quay lại
            </button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>CMND</th>
                    <th>Họ tên</th>
                    <th>Mã trường</th>
                    <th>Mã ngành</th>
                    <th>Công việc</th>
                    <th>Công ty</th>
                    <th>Thời gian làm</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="x : ${ds}">
                    <td th:text="${x.soCMND}"></td>
                    <td th:text="${x.hoTen}"></td>
                    <td th:text="${x.maTruong}"></td>
                    <td th:text="${x.maNganh}"></td>
                    <td th:text="${x.tenCongViec}"></td>
                    <td th:text="${x.tenCongTy}"></td>
                    <td th:text="${x.thoiGianLamViec}"></td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
